name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  ci:
    name: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04-arm, xcode-27]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: laputa-systems/ssh-build
          ref: 7f4f5157018f3c8544653d8a784169aee3a3b945
          path: ssh-build
          persist-credentials: false
      - run: ln -s "$GITHUB_WORKSPACE/ssh-build/vendor/graviola" "$GITHUB_WORKSPACE/../graviola"
      - name: test
        run: make test
